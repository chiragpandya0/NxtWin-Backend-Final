# One domain for everything: the Next.js frontend at /, the API at /api and Socket.IO at /socket.io.
# Replaces the config certbot edited; it reuses the certificate certbot already issued.
upstream nxtwin_backend {
    server 127.0.0.1:5500;
    keepalive 32;
}

upstream nxtwin_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Needed for Socket.IO websocket upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name probo.insightfusionanalytics.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name probo.insightfusionanalytics.com;

    ssl_certificate     /etc/letsencrypt/live/probo.insightfusionanalytics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/probo.insightfusionanalytics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    # Frontend's own API route (must win over /api/ below)
    location /api/gemini/ {
        proxy_pass http://nxtwin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend API, health check and websockets
    location /api/ {
        proxy_pass http://nxtwin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://nxtwin_backend;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://nxtwin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend (including its own /api/gemini route)
    location / {
        proxy_pass http://nxtwin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
